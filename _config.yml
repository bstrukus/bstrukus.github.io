# ---------------------------------------------------------------------
# Minimal Jekyll config.
#
# There is deliberately NO `theme:` line, but that doesn't mean no theme:
# with none named, GitHub Pages falls back to its default, Primer. That's
# harmless here. Our own _layouts/ take precedence over the theme's, and
# index.html is never templated, so nothing on the site uses Primer. Its
# one visible trace is an unused /assets/css/style.css in the build
# output. All styling comes from assets/styles.css.
# (The Octocat look this repo had originally came from a
# `theme: jekyll-theme-minimal` line that used to live here.)
#
# Jekyll only processes files that begin with a `---` front matter block.
# index.html has none, so it is copied to the output byte-for-byte and is
# never templated. Jekyll's only job here is turning _posts/*.md into
# pages under /notes/.
# ---------------------------------------------------------------------

title: Ben Strukus
description: >-
  Seattle-based improviser, actor, and voice over artist.
url: https://www.benstrukus.com

# _posts/2026-09-08-mic-technique.md  ->  /notes/mic-technique/
permalink: /notes/:title/

# Every post gets the note layout automatically, so a new note's front
# matter only needs a title line. One less thing to remember.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: note
  # Keep the resume out of the generated sitemap. robots.txt asks crawlers
  # not to index it, and listing it in the sitemap would say the opposite.
  - scope:
      path: assets/resume.pdf
    values:
      sitemap: false

# Generates /sitemap.xml automatically, including every note.
# robots.txt already points at it. Supported natively by GitHub Pages.
plugins:
  - jekyll-sitemap

# Repo docs shouldn't get published as pages.
exclude:
  - README.md
  - assets/README.md
