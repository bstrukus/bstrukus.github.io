<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- The page shell for everything Jekyll builds (currently: the notes).
     index.html does NOT use this file — it has no front matter, so Jekyll
     copies it verbatim. That's intentional: the homepage can't be broken
     by a template change.

     {{ ... }} is Liquid, Jekyll's template syntax. It's the only templating
     on the site, and this is very nearly all of it. -->

<title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%99%EF%B8%8F</text></svg>">

<meta property="og:title" content="{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/headshot.jpg' | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/styles.css">
</head>

<body>

<!-- Deliberately shorter than the homepage nav. The homepage nav is made of
     same-page anchors (#about, #contact) that mean nothing here, and keeping
     two copies of the full nav in sync is exactly the drift problem worth
     avoiding. Someone reading a note wants two doors: back to the list, or
     back to the front page. -->
<nav>
  <div class="wrap">
    <a class="brand" href="/">Ben Strukus</a>
    <a href="/notes/">Notes</a>
    <a href="/#contact">Contact</a>
  </div>
</nav>

{{ content }}

<footer>
  <div class="wrap">
    &copy; <span id="year">2026</span> Ben Strukus
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
