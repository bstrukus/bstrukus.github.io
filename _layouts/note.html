---
layout: default
---
<article class="note wrap">
  <p class="eyebrow"><a href="/notes/">&larr; Notes</a></p>
  <h1>{{ page.title }}</h1>
  <p class="note-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>

  {{ content }}
</article>
